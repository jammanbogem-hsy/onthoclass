<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강태공 관리자</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f4f6fb; --card: #fff; --ink: #191f3a; --ink2: #4b5378; --muted: #8a92b2; --line: #e3e7f2; --pri: #3a6df0; --hot: #f0455a; --ok: #2c7a12; }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; }
  header { background: #1d2147; color: #fff; }
  header div { width: min(1200px, 100%); margin: 0 auto; padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 18px; margin-right: auto; } header a, header button { color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 10px; padding: 8px 12px; text-decoration: none; font-size: 14px; font-weight: 700; }
  main { width: min(1200px, 100%); margin: 0 auto; padding: 18px 16px 60px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; } .kpi small { color: var(--muted); font-size: 12px; } .kpi b { display: block; font-size: 24px; margin-top: 4px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; color: var(--ink2); }
  .tabs button[aria-selected=true] { background: var(--pri); color: #fff; border-color: var(--pri); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--bg); color: var(--ink2); white-space: nowrap; }
  .pill.on { background: #e5f8dc; color: var(--ok); } .pill.bad { background: #ffe1e5; color: var(--hot); }
  .sbtn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 700; }
  .sbtn.warn { color: var(--hot); border-color: #f6c5cc; }
  .log { padding: 10px 0; border-bottom: 1px solid var(--line); } .log.done { opacity: .5; }
  .log p { margin: 4px 0; white-space: pre-wrap; } .log small { color: var(--muted); } .log pre { font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: auto; background: var(--bg); padding: 6px; border-radius: 6px; }
  .center { text-align: center; padding: 60px 16px; color: var(--ink2); }
  .big { border: 0; background: var(--pri); color: #fff; border-radius: 12px; padding: 14px 20px; font-size: 16px; font-weight: 800; }
  .modal { position: fixed; inset: 0; background: rgba(15,20,45,.5); display: grid; place-items: center; padding: 16px; z-index: 9; }
  .sheet { background: #fff; border-radius: 18px; padding: 18px; width: min(900px, 100%); max-height: calc(100dvh - 32px); overflow: auto; }
</style>
</head>
<body>
<header><div><b>🎣 전국 강태공 대결 · 관리자</b><a href="teacher.html">선생님 화면</a><a href="rank.html" target="_blank">전국 순위</a><button id="out" hidden>로그아웃</button></div></header>
<main id="main"><p class="center">불러오는 중…</p></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script type="module" src="admin.js?v=1"></script>
</body>
</html>
