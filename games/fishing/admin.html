<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>강태공 관리자</title>
<meta name="robots" content="noindex">
<link rel="preload" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Galmuri11"; src: url("https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/Galmuri11-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root { --ink: #13162e; --night: #1d2147; --panel: #1b2045; --panel2: #2a3160; --panel3: #333c75; --cream: #fff8e8; --muted: #b9c1e8; --hot: #ff4d6d; --sun: #ffd23f; --lime: #9cf25a; --sky: #3ec7ff; --pink: #ff9ecb;
    --px: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
    --b3: 0 -3px 0 var(--ink), 0 3px 0 var(--ink), -3px 0 0 var(--ink), 3px 0 0 var(--ink); --b4: 0 -4px 0 var(--ink), 0 4px 0 var(--ink), -4px 0 0 var(--ink), 4px 0 0 var(--ink);
    --pxbox: var(--b4), inset 0 4px 0 rgba(255, 255, 255, .1), inset 0 -4px 0 rgba(0, 0, 0, .3), 0 12px 0 rgba(0, 0, 0, .35); }
  * { box-sizing: border-box; } [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--night); color: var(--cream); font-family: var(--px); font-weight: 700; -webkit-font-smoothing: none; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .ic { display: inline-flex; font-style: normal; vertical-align: -.16em; line-height: 1; flex: none; } .ic svg, .pxi { display: block; image-rendering: pixelated; }
  header { background: rgba(19, 22, 46, .96); box-shadow: 0 4px 0 var(--ink), 0 8px 0 rgba(0, 0, 0, .25); position: sticky; top: 0; z-index: 5; padding-top: env(safe-area-inset-top); }
  header div { width: min(1200px, 100%); margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header b { font-size: 19px; margin-right: auto; display: flex; align-items: center; gap: 10px; text-shadow: 2px 2px 0 var(--ink); } header b small { font-size: 13px; background: var(--hot); color: var(--cream); padding: 3px 8px 4px; text-shadow: none; box-shadow: var(--b3); }
  header a, header button { color: var(--cream); background: var(--panel2); padding: 8px 12px; text-decoration: none; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; margin: 3px; box-shadow: var(--b3), inset 0 3px 0 rgba(255, 255, 255, .12), inset 0 -4px 0 rgba(0, 0, 0, .3); }
  header a:hover, header button:hover { background: var(--panel3); }
  main { width: min(1200px, 100%); margin: 0 auto; padding: 24px 16px 60px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin: 0 4px 22px; }
  .kpi { background: var(--panel); box-shadow: var(--b4), inset 0 4px 0 rgba(255, 255, 255, .08); padding: 12px 14px; } .kpi small { color: var(--muted); font-size: 13px; } .kpi b { display: block; font-size: 28px; margin-top: 6px; color: var(--sun); text-shadow: 2px 2px 0 var(--ink); } .kpi b small { color: var(--lime); font-size: 15px; text-shadow: none; }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 16px; padding: 4px; }
  .tabs button { background: var(--panel2); color: var(--cream); padding: 8px 14px 10px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--b3), inset 0 3px 0 rgba(255, 255, 255, .12), inset 0 -4px 0 rgba(0, 0, 0, .3); }
  .tabs button:hover { background: var(--panel3); }
  .tabs button[aria-selected=true] { background: var(--sun); color: var(--ink); box-shadow: var(--b3), inset 0 3px 0 rgba(255, 255, 255, .5), inset 0 -4px 0 rgba(0, 0, 0, .2); }
  .tabs button i.n { font-style: normal; background: var(--hot); color: var(--cream); padding: 0 6px; font-size: 13px; }
  .tabs [data-reload] { margin-left: auto; }
  .card { background: var(--panel); box-shadow: var(--pxbox); padding: 16px; overflow-x: auto; margin: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 13px; color: var(--muted); padding: 10px 8px; background: var(--ink); white-space: nowrap; }
  td { padding: 10px 8px; border-bottom: 3px solid var(--ink); vertical-align: middle; } td small { color: var(--muted); }
  tbody tr:nth-child(odd) td { background: rgba(255, 248, 232, .03); }
  body { word-break: keep-all; overflow-wrap: anywhere; }
  th, td { white-space: nowrap; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { font-size: 12px; padding: 3px 8px 4px; background: var(--ink); color: var(--muted); white-space: nowrap; }
  .pill.on { color: var(--lime); } .pill.bad { color: var(--cream); background: var(--hot); }
  .sbtn { background: var(--panel2); color: var(--cream); padding: 6px 10px 8px; font-size: 13px; min-height: 36px; margin: 3px; box-shadow: var(--b3), inset 0 -3px 0 rgba(0, 0, 0, .3); display: inline-flex; align-items: center; gap: 4px; }
  .sbtn:hover { background: var(--panel3); } .sbtn:active { transform: translateY(2px); }
  .sbtn.warn { background: var(--hot); }
  .log { padding: 12px 0; border-bottom: 3px solid var(--ink); } .log.done { opacity: .5; }
  .log p { margin: 6px 0; white-space: pre-wrap; line-height: 1.6; font-size: 15px; } .log small { color: var(--muted); } .log pre { font-size: 12px; color: var(--muted); white-space: pre-wrap; max-height: 120px; overflow: auto; background: var(--ink); padding: 8px; }
  .center { text-align: center; padding: 70px 16px; color: var(--muted); font-size: 17px; line-height: 1.7; }
  .big { background: var(--sun); color: var(--ink); padding: 14px 22px 16px; font-size: 18px; margin: 10px; display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 -5px 0 var(--ink), 0 5px 0 var(--ink), -5px 0 0 var(--ink), 5px 0 0 var(--ink), inset 0 5px 0 rgba(255, 255, 255, .5), inset 0 -6px 0 rgba(0, 0, 0, .2), 0 11px 0 rgba(0, 0, 0, .4); }
  .big:active { transform: translateY(5px); }
  .modal { position: fixed; inset: 0; background: rgba(8, 10, 24, .72); display: grid; place-items: center; padding: 16px; z-index: 9; }
  .sheet { background: var(--panel); box-shadow: var(--pxbox); padding: 20px; width: min(900px, calc(100% - 8px)); max-height: calc(100dvh - 40px); overflow: auto; }
  .sheet h2 small { font-size: 14px; color: var(--muted); }
  @media (max-width: 600px) { header b { font-size: 16px; } .kpi b { font-size: 22px; } }
</style>
</head>
<body>
<header><div><b><i class="ic" data-i="rod" data-s="28"></i>전국 강태공 대결 <small>관리자</small></b><a href="teacher.html"><i class="ic" data-i="school" data-s="20"></i>선생님 화면</a><a href="rank.html" target="_blank" rel="noopener"><i class="ic" data-i="trophy" data-s="20"></i>전국 순위</a><button id="out" hidden><i class="ic" data-i="logout" data-s="20"></i>로그아웃</button></div></header>
<main id="main"><p class="center">불러오는 중…</p></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<script type="module" src="./icons.js?v=2"></script>
<script type="module" src="admin.js?v=2"></script>
</body>
</html>
